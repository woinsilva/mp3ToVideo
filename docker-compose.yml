services:
  postgres:
    image: postgres:16-alpine
    container_name: video-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: video-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama
    container_name: video-ollama
    restart: unless-stopped
    gpus: all
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0s}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  ollama-model:
    image: curlimages/curl:8.12.1
    container_name: video-ollama-model
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    command:
      - /bin/sh
      - -c
      - 'curl -fsS http://ollama:11434/api/pull -d "{\"model\":\"$${OLLAMA_MODEL}\",\"stream\":false}"'

volumes:
  postgres_data:
  redis_data:
  ollama_data:
