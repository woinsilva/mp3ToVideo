services:
  postgres:
    image: postgres:16-alpine
    container_name: video-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: video-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama
    container_name: video-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  ollama-model:
    image: curlimages/curl:8.12.1
    container_name: video-ollama-model
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    command:
      - /bin/sh
      - -c
      - 'curl -fsS http://ollama:11434/api/pull -d "{\"model\":\"$${OLLAMA_MODEL}\",\"stream\":false}"'

  comfyui:
    profiles: ["comfyui"]
    container_name: video-comfyui
    build:
      context: .
      dockerfile: infra/docker/comfyui.Dockerfile
      args:
        COMFYUI_GIT_REF: ${COMFYUI_GIT_REF:-master}
        PIP_EXTRA_INDEX_URL: ${COMFYUI_PYTORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
        APT_EXTRA_PACKAGES: ${COMFYUI_APT_EXTRA_PACKAGES:-}
    restart: unless-stopped
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    gpus: all
    environment:
      CLI_ARGS: ${COMFYUI_CLI_ARGS:---listen 0.0.0.0}
      PIP_EXTRA_PACKAGES: ${COMFYUI_PIP_EXTRA_PACKAGES:-}
    volumes:
      - ${COMFYUI_MODELS_HOST_PATH:-./storage/comfyui/models}:/comfyui/models
      - ${COMFYUI_INPUT_HOST_PATH:-./storage/comfyui/input}:/comfyui/input
      - ${COMFYUI_OUTPUT_HOST_PATH:-./storage/comfyui/output}:/comfyui/output
      - ${COMFYUI_CUSTOM_NODES_HOST_PATH:-./storage/comfyui/custom_nodes}:/comfyui/custom_nodes
      - ${COMFYUI_USER_HOST_PATH:-./storage/comfyui/user}:/comfyui/user
      - ${COMFYUI_TEMP_HOST_PATH:-./storage/comfyui/temp}:/comfyui/temp

volumes:
  postgres_data:
  redis_data:
  ollama_data:
